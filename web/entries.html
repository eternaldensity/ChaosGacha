<style>
.catpick { display: flex; gap: 8px; flex-wrap: wrap; }
.catpick button.sel { border-color: var(--accent); color: var(--accent); }
#entriesTable th { font-family: var(--font-display); }
#entriesTable tbody tr:hover { background: rgba(238, 194, 95, .05); }
#entriesTable tr.desc td { background: rgba(255, 255, 255, .02); }
</style>

<body>
<header class="app">
  <h1>📚 Entries</h1>
  <a class="homelink" href="index.html">🏠 <span class="lbl">Home</span></a>
  <nav><a href="gacha.html">🎰 Gacha</a></nav>
</header>
<main>
  <section>
    <div class="card">
      <div class="row">
        <div><label for="eq">Search</label>
          <input type="search" id="eq" placeholder="name, source, or description…"></div>
      </div>
      <label>Categories</label>
      <div class="catpick" id="eqCats"></div>
      <div class="row">
        <div><label for="eqMin">Rarity from</label>
          <input type="number" id="eqMin" step="0.1" min="0" placeholder="any"></div>
        <div><label for="eqMax">Rarity to</label>
          <input type="number" id="eqMax" step="0.1" min="0" placeholder="any"></div>
      </div>
      <details id="eqSrcBox" style="margin-top:8px">
        <summary title="Uncheck sources to exclude them. Uncheck all = include everything.">Sources (<span id="eqSrcCount">all</span>)</summary>
        <div class="row" style="margin:6px 0">
          <button id="eqAll">All</button>
          <button id="eqNone">None</button>
        </div>
        <div id="eqSources"></div>
      </details>
      <div class="muted small" id="eqCount" style="margin-top:8px"></div>
      <div style="overflow-x:auto;margin-top:8px">
        <table id="entriesTable" style="width:100%;border-collapse:collapse;font-size:0.9rem">
          <thead><tr id="eqHead"></tr></thead>
          <tbody id="eqBody"></tbody>
        </table>
      </div>
      <div style="margin-top:8px"><button id="eqMore" style="width:100%">Show more</button></div>
    </div>
  </section>
</main>
<div id="toast" class="toast" style="display:none"></div>
