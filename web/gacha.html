<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chaos Gacha</title>
<link rel="stylesheet" href="css/app.css">
<style>
.preset-grid, .cat-grid { display: grid; gap: 8px; }
.preset-grid { grid-template-columns: repeat(3, 1fr); }
.cat-grid { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 700px) { .cat-grid { grid-template-columns: repeat(3, 1fr); } }
.pick { border: 2px solid transparent; }
.pick.sel { border-color: var(--accent); background: #2a3342; }
.pick.sel { border-color: #fff; }
#rollBtn { width: 100%; font-size: 1.25rem; min-height: 60px; }
.result-name { font-size: 1.2rem; margin: 4px 0; }
/* Spin wheel: a vertical reel seen edge-on. Rows compress and fade toward
   the top/bottom so it reads as a thick wheel spinning past. */
.reel {
  --rowh: 54px;
  height: calc(var(--rowh) * 5);
  overflow: hidden;
  position: relative;
  border-radius: 10px;
  background: #10131a;
  border: 1px solid var(--line);
  -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
  mask-image: linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
}
.reel-inner { will-change: transform; }
.rrow {
  height: var(--rowh);
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px;
  border-bottom: 1px solid #1c2029;
  transform-origin: center center;
  overflow: hidden; white-space: nowrap;
}
.rrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.rrow.winner { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 8px; }
</style>
</head>
<body>
<header class="app">
  <h1>🎰 Chaos Gacha</h1>
  <nav><a href="tree.html">🌳 Tree</a></nav>
</header>
<main>
  <section class="tabpage active" id="tab-roll">
    <div class="card">
      <h2>Ticket</h2>
      <label>Preset</label>
      <div class="preset-grid" id="presetGrid"></div>
      <div class="row" style="margin-top:8px">
        <div><label for="cMin">Min</label><input type="number" id="cMin" step="0.1" value="1.5"></div>
        <div><label for="cAvg">Avg</label><input type="number" id="cAvg" step="0.1" value="3.3"></div>
        <div><label for="cMax">Max</label><input type="number" id="cMax" step="0.1" value="5.3"></div>
      </div>
      <label style="margin-top:8px">Category</label>
      <div class="cat-grid" id="catGrid"></div>
      <label for="q">Filter pool (optional)</label>
      <input type="search" id="q" placeholder="name or source contains…">
      <div style="margin-top:12px"><button class="primary" id="rollBtn">ROLL</button></div>
      <div class="row" style="margin-top:8px">
        <div><label for="spinSpeed">Spin slowdown</label>
          <select id="spinSpeed">
            <option value="off">Off (instant)</option>
            <option value="fast">Fast</option>
            <option value="normal" selected>Normal</option>
            <option value="slow">Slow</option>
          </select></div>
      </div>
    </div>
    <div class="card" id="reelCard" style="display:none">
      <div class="reel" id="reel" title="Tap to skip"><div class="reel-inner" id="reelInner"></div></div>
      <div class="muted small" style="margin-top:4px">Tap the wheel to skip.</div>
    </div>
    <div class="card" id="resultCard" style="display:none">
      <h2>Result</h2>
      <div class="result" id="resultBody"></div>
    </div>
    <div class="card">
      <h2>My tickets <span class="muted small" id="ticketCount"></span></h2>
      <div class="row">
        <div><label for="tkTier">Tier</label><select id="tkTier"></select></div>
        <div><label for="tkCat">Category</label><select id="tkCat"></select></div>
      </div>
      <div style="margin-top:10px"><button id="btnAddTicket" style="width:100%">+ Add ticket</button></div>
      <ul class="list" id="ticketList"></ul>
    </div>
  </section>

  <section class="tabpage" id="tab-history">
    <div class="card">
      <div class="row">
        <h2 style="flex:1">History <span class="muted small" id="histCount"></span></h2>
        <div style="flex:0 0 auto" class="row">
          <button id="btnExportHist">⬇</button>
          <button id="btnImportHist">⬆</button>
          <button id="btnClearHist" class="danger">Clear</button>
          <input type="file" id="fileHist" accept=".json,application/json" style="display:none">
        </div>
      </div>
      <ul class="list" id="histList"></ul>
    </div>
  </section>
</main>
<nav class="tabs" id="tabs">
  <button data-tab="roll" class="active"><span class="ico">🎰</span>Roll</button>
  <button data-tab="history"><span class="ico">📜</span>History</button>
</nav>
<div id="toast" class="toast" style="display:none"></div>
<script src="data/entries.js"></script>
<script src="js/gacha.js"></script>
<script src="js/gacha-app.js"></script>
</body>
</html>
